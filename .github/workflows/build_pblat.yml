name: Build pblat (macOS 14)

on:
  push:
  pull_request:

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pblat:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          brew install make zlib

      - name: Build pblat
        run: |
          git clone --depth=1 https://github.com/icebert/pblat.git pblat-src
          cd pblat-src
          make -j$(sysctl -n hw.ncpu)
          ls -lh pblat*
        env:
          CFLAGS: -I$(brew --prefix zlib)/include
          LDFLAGS: -L$(brew --prefix zlib)/lib

      - name: Upload pblat binary
        uses: actions/upload-artifact@v4
        with:
          name: pblat-macos-14
          path: pblat-src/pblat