name: circtools nanopore (pip)

on:
  push:
  workflow_run:
    workflows: ["API Health Check"]
    types: [completed]


concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Main:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15, macos-15-intel, macos-26, ubuntu-22.04, ubuntu-24.04 ]
        python-version: ["3.10",  "3.13", "3.14"]
    name: Python ${{ matrix.python-version }} | ${{ matrix.os }}
    steps:
    - name: Create files
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref_name }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: '' 
        

    - name: Updating setuptools
      run: |
        python3 -m pip install -U pip setuptools

    - name: Install build tools and fix ARCHFLAGS for macOS Intel
      if: matrix.os == 'macos-15-intel' || 'macos-14'
      run: |
        echo "Applying macOS Intel-specific build setup"
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer || true
        brew install xz pkg-config make autoconf automake libtool || true
        export LDFLAGS="-L/opt/homebrew/lib"
        export CPPFLAGS="-I/opt/homebrew/include"
        export ARCHFLAGS="-arch x86_64"
        # Disable LZMA if headers still not found
        export HTSLIB_CONFIGURE_OPTIONS="--disable-lzma"
        python3 -m pip install -v ./

    - name: Install dependencies on macOS ARM
      if: startsWith(matrix.os, 'macos-15') || matrix.os == 'macos-26'
      run: |
        brew install xz pkg-config || true
        python3 -m pip install ./

    - name: Install dependencies on macOS 14
      if: matrix.os == 'macos-14'
      run: |
        brew install xz pkg-config || true
        python3 -m pip install ./

    - name: Install Linux dependencies
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            make g++ zlib1g-dev \
            libblas-dev libatlas-base-dev liblapack-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
        python3 -m pip install ./


    - name: Check if circtools starts
      run: |
        circtools --version
        which circtools


    - name: Install bioinformatics dependencies (bedtools, pblat, samtools, pybedtools) with retry
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 200
        max_attempts: 3
        retry_on: error
        command: |
          set -euxo pipefail

          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -y
            sudo apt-get install -y make g++ zlib1g-dev wget samtools libssl-dev python3-pip

            # bedtools 2.31.1
            wget --tries=5 --waitretry=10 https://github.com/arq5x/bedtools2/releases/download/v2.31.1/bedtools-2.31.1.tar.gz
            tar -xzf bedtools-2.31.1.tar.gz
            cd bedtools2
            make -j4
            sudo cp bin/* /usr/local/bin/
            cd ..

            # pblat
            git clone --depth=1 https://github.com/wjmellon/pblat.git pblat-src
            cd pblat-src
            make
            sudo cp pblat /usr/local/bin/ || sudo cp pblat_bin /usr/local/bin/pblat
            cd ..

            # pybedtools (Python interface to bedtools)
            python3 -m pip install --upgrade pip
            pip install pybedtools

          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Install core packages (retry internally if needed)
            brew update || echo "brew update failed — continuing"
            brew install make gcc wget zlib samtools openssl@3 || true
            brew install gnu-sed grep || true
            sudo ln -sf "$(which gsed)" /usr/local/bin/sed || true
            sudo ln -sf "$(which ggrep)" /usr/local/bin/grep || true

            # Resolve Homebrew prefixes (brew --prefix picks the right path
            # natively on both arm64 and Intel runners, no Rosetta needed)
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            ZLIB_PREFIX="$(brew --prefix zlib)"

            export CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${ZLIB_PREFIX}/include ${CPPFLAGS:-}"
            export LDFLAGS="-L${OPENSSL_PREFIX}/lib -L${ZLIB_PREFIX}/lib ${LDFLAGS:-}"
            export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig:${ZLIB_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export LIBRARY_PATH="${OPENSSL_PREFIX}/lib:${ZLIB_PREFIX}/lib:${LIBRARY_PATH:-}"

            # bedtools 2.31.1
            wget --tries=5 --waitretry=10 https://github.com/arq5x/bedtools2/releases/download/v2.31.1/bedtools-2.31.1.tar.gz
            tar -xzf bedtools-2.31.1.tar.gz
            cd bedtools2
            make -j4
            sudo cp bin/* /usr/local/bin/
            cd ..

            # pblat — build natively for whatever arch the runner is
            # (arm64 or x86_64). No Rosetta / second Homebrew prefix needed:
            # Homebrew's installer now refuses to bootstrap under a spoofed
            # `arch -x86_64` on Apple Silicon, and a native build works fine.
            echo "Building pblat natively for $(uname -m)"
            git clone --depth=1 https://github.com/wjmellon/pblat.git pblat-src
            cd pblat-src
            make
            sudo cp pblat /usr/local/bin/ || sudo cp pblat_bin /usr/local/bin/pblat
            cd ..

            # pybedtools
            pip3 install pybedtools

          else
            echo "Unsupported OS: $RUNNER_OS" >&2
            exit 1
          fi





    - name: Fix hardcoded openssl@3 path for bundled pblat binary on macOS
      if: runner.os == 'macOS'
      run: |
        # circtools ships a prebuilt Intel pblat binary
        # (contrib/pblat/AMD64/mac/pblat), run via Rosetta 2 on Apple
        # Silicon. It's dynamically linked against
        # /usr/local/opt/openssl@3/lib/libssl.3.dylib. On Apple Silicon
        # runners, Homebrew lives under /opt/homebrew, so that path doesn't
        # exist and the binary aborts at load time. Recreate the expected
        # /usr/local path as symlinks to the real Homebrew prefix.
        OPENSSL_PREFIX="$(brew --prefix openssl@3)"
        echo "Real openssl@3 prefix: $OPENSSL_PREFIX"

        if [ "$OPENSSL_PREFIX" != "/usr/local/opt/openssl@3" ]; then
          sudo mkdir -p /usr/local/opt/openssl@3
          sudo ln -sfn "$OPENSSL_PREFIX/lib" /usr/local/opt/openssl@3/lib
          sudo ln -sfn "$OPENSSL_PREFIX/include" /usr/local/opt/openssl@3/include
        fi

        ls -l /usr/local/opt/openssl@3/lib/libssl.3.dylib

    - name: Ensure Rosetta 2 is installed on Apple Silicon
      if: runner.os == 'macOS'
      run: |
        if [ "$(uname -m)" = "arm64" ]; then
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "Rosetta 2 OK"
        fi

    - name: Fix zcat on macOS
      if: runner.os == 'macOS'
      run: |
        # Make zcat an alias to gunzip -c
        echo '#!/bin/bash' | sudo tee /usr/local/bin/zcat
        echo 'exec gunzip -c "$@"' | sudo tee -a /usr/local/bin/zcat
        sudo chmod +x /usr/local/bin/zcat
        export PATH="/usr/local/bin:$PATH"
        which zcat
        zcat --version || true





    - name: Unpack test dataset
      run: |
        tar xvf ./tests/data/circtools_example.tar.bz2
        cd circtools_example
        if [ -f genome.fa.gz ]; then gunzip -f genome.fa.gz; fi
        if [ -f annotation.gtf.gz ]; then gunzip -f annotation.gtf.gz; fi
        ls -lh

    - name: Subsample nanopore data
      run: |
        cd circtools_example
        cp ../tests/data/human_nanopore.fastq.gz .
        if [ "$RUNNER_OS" = "macOS" ]; then
          gzcat human_nanopore.fastq.gz | head -n 4000000 | gzip > human_nanopore_1M.fastq.gz
        else
          zcat human_nanopore.fastq.gz | head -n 4000000 | gzip > human_nanopore_1M.fastq.gz
        fi
        ls -lh human_nanopore_1M.fastq.gz


    - name: Download reference data (nanopore)
      run: |
        cd circtools_example
        mkdir -p reference
        circtools nanopore \
          -d \
          -R reference \
          -C hg38

    - name: Run circtools nanopore (pip)
      run: |
        cd circtools_example
        mkdir -p nanopore_output
        circtools nanopore \
          -r \
          -s human_nanopore_1M.fastq.gz \
          -R reference \
          -C hg38 \
          -O nanopore_output/ \
          --threads 16

    - name: Upload nanopore output artifact
      uses: actions/upload-artifact@v4
      with:
        name: nanopore-output-${{ matrix.os }}-py${{ matrix.python-version }}
        path: circtools_example/nanopore_output/
        if-no-files-found: warn
        retention-days: 5
  

    - name: Checking generated output against master output
      run: |
        cd circtools_example
        cd nanopore_output
        ls -la
        if [ "$RUNNER_OS" = "Linux" ]; then
          MASTER_DIR="../nanopore_master"
          diff human_nanopore_1M.circRNA_candidates.annotated.txt "$MASTER_DIR/human_nanopore_1M.circRNA_candidates.annotated.txt"
          sha1sum -c "$MASTER_DIR/sha1sums.txt"
        elif [ "$RUNNER_OS" = "macOS" ] && { [ "${{ matrix.os }}" = "macos-14" ] || [ "${{ matrix.os }}" = "macos-15-intel" ]; }; then
          MASTER_DIR="../nanopore_master_mac_amd"
          diff human_nanopore_1M.circRNA_candidates.annotated.txt "$MASTER_DIR/human_nanopore_1M.circRNA_candidates.annotated.txt"
          shasum -a 1 -c "$MASTER_DIR/sha1sums.txt"
        elif [ "$RUNNER_OS" = "macOS" ] && { [ "${{ matrix.os }}" = "macos-15" ] || [ "${{ matrix.os }}" = "macos-26" ]; }; then
          MASTER_DIR="../nanopore_master_mac"
          diff human_nanopore_1M.circRNA_candidates.annotated.txt "$MASTER_DIR/human_nanopore_1M.circRNA_candidates.annotated.txt"
          shasum -a 1 -c "$MASTER_DIR/sha1sums.txt"
        else
          echo "Unsupported OS: $RUNNER_OS" >&2
          exit 1
        fi