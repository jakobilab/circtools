name: circtools nanopore (pip)

on:
  push:
  workflow_run:
    workflows: ["API Health Check"]
    types: [completed]


concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Main:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-15-intel, macos-26, ubuntu-22.04, ubuntu-24.04 ]
        python-version: ["3.10",  "3.13", "3.14"]
    name: Python ${{ matrix.python-version }} | ${{ matrix.os }}
    steps:
    - name: Create files
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref_name }}
    
    - name: Report actual architecture
      run: uname -m

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: '' 
        

    - name: Updating setuptools
      run: |
        python3 -m pip install -U pip setuptools

    - name: Install build tools and fix ARCHFLAGS for macOS Intel
      if: matrix.os == 'macos-15-intel' 
      run: |
        echo "Applying macOS Intel-specific build setup"
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer || true
        brew install xz pkg-config make autoconf automake libtool || true
        export LDFLAGS="-L/opt/homebrew/lib"
        export CPPFLAGS="-I/opt/homebrew/include"
        export ARCHFLAGS="-arch x86_64"
        # Disable LZMA if headers still not found
        export HTSLIB_CONFIGURE_OPTIONS="--disable-lzma"
        python3 -m pip install -v ./

    - name: Install dependencies on macOS ARM
      if: startsWith(matrix.os, 'macos-15') || matrix.os == 'macos-26'
      run: |
        brew install xz pkg-config || true
        python3 -m pip install ./


    - name: Install Linux dependencies
      if: startsWith(matrix.os, 'ubuntu-')
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            make g++ zlib1g-dev \
            libblas-dev libatlas-base-dev liblapack-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev
        python3 -m pip install ./


    - name: Check if circtools starts
      run: |
        circtools --version
        which circtools

    
    - name: Ensure Rosetta 2 is installed on Apple Silicon
      if: runner.os == 'macOS'
      run: |
        if [ "$(uname -m)" = "arm64" ]; then
          softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true && echo "Rosetta 2 OK"
        fi



    - name: Install bioinformatics dependencies (bedtools, pblat, samtools, pybedtools) with retry
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 200
        max_attempts: 3
        retry_on: error
        command: |
          set -euxo pipefail

          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -y
            sudo apt-get install -y make g++ zlib1g-dev wget samtools libssl-dev python3-pip

            # bedtools 2.31.1
            wget --tries=5 --waitretry=10 https://github.com/arq5x/bedtools2/releases/download/v2.31.1/bedtools-2.31.1.tar.gz
            tar -xzf bedtools-2.31.1.tar.gz
            cd bedtools2
            make -j4
            sudo cp bin/* /usr/local/bin/
            cd ..

            # pblat
            git clone --depth=1 https://github.com/wjmellon/pblat.git pblat-src
            cd pblat-src
            make
            sudo cp pblat /usr/local/bin/ || sudo cp pblat_bin /usr/local/bin/pblat
            cd ..

            # pybedtools (Python interface to bedtools)
            python3 -m pip install --upgrade pip
            pip install pybedtools

          elif [ "$RUNNER_OS" = "macOS" ]; then
            # Install core packages (retry internally if needed)
            brew update || echo "brew update failed — continuing"
            brew install make gcc wget zlib samtools openssl@3 || true
            brew install gnu-sed grep || true
            sudo ln -sf "$(which gsed)" /usr/local/bin/sed || true
            sudo ln -sf "$(which ggrep)" /usr/local/bin/grep || true

            # Resolve Homebrew prefixes (brew --prefix picks the right path
            # natively on both arm64 and Intel runners, no Rosetta needed)
            OPENSSL_PREFIX="$(brew --prefix openssl@3)"
            ZLIB_PREFIX="$(brew --prefix zlib)"

            export CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${ZLIB_PREFIX}/include ${CPPFLAGS:-}"
            export LDFLAGS="-L${OPENSSL_PREFIX}/lib -L${ZLIB_PREFIX}/lib ${LDFLAGS:-}"
            export PKG_CONFIG_PATH="${OPENSSL_PREFIX}/lib/pkgconfig:${ZLIB_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export LIBRARY_PATH="${OPENSSL_PREFIX}/lib:${ZLIB_PREFIX}/lib:${LIBRARY_PATH:-}"

            # bedtools 2.31.1
            wget --tries=5 --waitretry=10 https://github.com/arq5x/bedtools2/releases/download/v2.31.1/bedtools-2.31.1.tar.gz
            tar -xzf bedtools-2.31.1.tar.gz
            cd bedtools2
            make -j4
            sudo cp bin/* /usr/local/bin/
            cd ..

            # pybedtools
            pip3 install pybedtools

          else
            echo "Unsupported OS: $RUNNER_OS" >&2
            exit 1
          fi



    - name: Fix zcat on macOS
      if: runner.os == 'macOS'
      run: |
        # Make zcat an alias to gunzip -c
        echo '#!/bin/bash' | sudo tee /usr/local/bin/zcat
        echo 'exec gunzip -c "$@"' | sudo tee -a /usr/local/bin/zcat
        sudo chmod +x /usr/local/bin/zcat
        export PATH="/usr/local/bin:$PATH"
        which zcat
        zcat --version || true





    - name: Unpack test dataset
      run: |
        tar xvf ./tests/data/circtools_example.tar.bz2
        cd circtools_example
        if [ -f genome.fa.gz ]; then gunzip -f genome.fa.gz; fi
        if [ -f annotation.gtf.gz ]; then gunzip -f annotation.gtf.gz; fi
        ls -lh

    - name: Subsample nanopore data
      run: |
        cd circtools_example
        cp ../tests/data/human_nanopore.fastq.gz .
        if [ "$RUNNER_OS" = "macOS" ]; then
          gzcat human_nanopore.fastq.gz | head -n 4000000 | gzip > human_nanopore_1M.fastq.gz
        else
          zcat human_nanopore.fastq.gz | head -n 4000000 | gzip > human_nanopore_1M.fastq.gz
        fi
        ls -lh human_nanopore_1M.fastq.gz


    - name: Download reference data (nanopore)
      run: |
        cd circtools_example
        mkdir -p reference
        circtools nanopore \
          -d \
          -R reference \
          -C hg38

    - name: Run circtools nanopore (pip)
      env:
          CIRCTOOLS_DEBUG: "1"
      run: |
        cd circtools_example
        mkdir -p nanopore_output
        circtools nanopore \
          -r \
          -s human_nanopore_1M.fastq.gz \
          -R reference \
          -C hg38 \
          -O nanopore_output/ \
          --threads 16 


    - name: Checking generated output against master output (soft check)
      run: |
        cd circtools_example/nanopore_output
        ls -la
        python3 - <<'PY'
        import os, sys

        OUT = "human_nanopore_1M.circRNA_candidates.annotated.txt"
        MASTER = os.path.join("..", "nanopore_master", OUT)

        # Tolerances. The pipeline gives near-identical but not byte-identical results
        # across operating systems, so compare the numbers instead of the bytes.
        MAX_TOTAL_DIFF  = float(os.environ.get("MAX_TOTAL_DIFF", "0.02"))   # total BSJ reads
        MIN_SHARED_FRAC = float(os.environ.get("MIN_SHARED_FRAC", "0.98"))  # reads in circRNAs found in both
        TOP_N           = int(os.environ.get("TOP_N", "10"))                # most abundant circRNAs in master
        MAX_TOP_DIFF    = float(os.environ.get("MAX_TOP_DIFF", "0.05"))     # read-count difference for those
        MAX_COUNT_DIFF  = float(os.environ.get("MAX_COUNT_DIFF", "0.10"))   # number of circRNAs

        def load(path):
            """(chr, start, end, strand) -> BSJ reads"""
            d = {}
            with open(path) as fh:
                next(fh, None)  # header
                for ln in fh:
                    f = ln.rstrip("\n").split("\t")
                    if len(f) < 8:
                        continue
                    try:
                        d[(f[1], f[2], f[3], f[6])] = int(float(f[5]))
                    except ValueError:
                        continue
            return d

        def rel(a, b):
            m = max(a, b)
            return abs(a - b) / m if m else 0.0

        def name(k):
            return f"{k[0]}:{k[1]}-{k[2]}({k[3]})"

        if not os.path.isfile(MASTER):
            print(f"::error::master file not found: {MASTER}")
            sys.exit(1)

        new, master = load(OUT), load(MASTER)
        failures = []

        if not new:
            failures.append("no circRNAs found in the generated output")
        if not master:
            failures.append("no circRNAs found in the master file")

        if new and master:
            tot_new, tot_master = sum(new.values()), sum(master.values())
            shared = [k for k in master if k in new]
            frac_new = sum(new[k] for k in shared) / tot_new
            frac_master = sum(master[k] for k in shared) / tot_master

            print(f"circRNAs: new={len(new)} master={len(master)} shared={len(shared)} "
                  f"only-new={len(new) - len(shared)} only-master={len(master) - len(shared)}")
            print(f"total BSJ reads: new={tot_new} master={tot_master} diff={rel(tot_new, tot_master):.2%}")
            print(f"reads in shared circRNAs: new={frac_new:.2%} master={frac_master:.2%}")

            if rel(tot_new, tot_master) > MAX_TOTAL_DIFF:
                failures.append(f"total BSJ reads differ by {rel(tot_new, tot_master):.2%} (limit {MAX_TOTAL_DIFF:.0%})")
            if min(frac_new, frac_master) < MIN_SHARED_FRAC:
                failures.append(f"only {min(frac_new, frac_master):.2%} of reads are in circRNAs found in both (limit {MIN_SHARED_FRAC:.0%})")
            if rel(len(new), len(master)) > MAX_COUNT_DIFF:
                failures.append(f"number of circRNAs differs: new={len(new)} master={len(master)} (limit {MAX_COUNT_DIFF:.0%})")

            print(f"\ntop {TOP_N} circRNAs of the master:")
            top = sorted(master, key=lambda k: -master[k])[:TOP_N]
            for k in top:
                n = new.get(k)
                if n is None:
                    print(f"  {name(k):45s} master={master[k]:<7d} new=MISSING")
                    failures.append(f"top circRNA {name(k)} ({master[k]} reads) is missing in the new output")
                else:
                    d = rel(n, master[k])
                    flag = "" if d <= MAX_TOP_DIFF else "   <-- too different"
                    print(f"  {name(k):45s} master={master[k]:<7d} new={n:<7d} diff={d:.1%}{flag}")
                    if d > MAX_TOP_DIFF:
                        failures.append(f"{name(k)}: {master[k]} vs {n} reads ({d:.1%}, limit {MAX_TOP_DIFF:.0%})")

            # informational: other shared circRNAs with >=10 reads that moved by more than 10%
            other = [k for k in shared if k not in top and max(new[k], master[k]) >= 10 and rel(new[k], master[k]) > 0.10]
            if other:
                print(f"\nnote: {len(other)} further circRNAs with >=10 reads differ by >10% (not a failure):")
                for k in sorted(other, key=lambda k: -master[k])[:10]:
                    print(f"  {name(k):45s} master={master[k]:<7d} new={new[k]}")

        print()
        if failures:
            for f in failures:
                print(f"::error::{f}")
            print("RESULT: FAIL - output differs from the master by more than the allowed tolerance")
            sys.exit(1)
        print("RESULT: PASS - output is within tolerance of the master")
        PY